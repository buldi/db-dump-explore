# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}   # self-hosted  # ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version:  ${{ matrix.python-version }}
    # - name: Cache pip packages
    #   id: cache-pip
    #   uses: actions/cache@v4
    #   with:
    #     path: ${{ steps.setup-python.outputs.python-packages-cache-dir }}
    #     key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements-dev.txt') }}
    #     restore-keys: |
    #       ${{ runner.os }}-pip-${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure dev tools used in CI are available
        python -m pip install ruff black isort pytest

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Format check (black)
      run: |
        black --check .

    - name: Test with pytest
      run: |
        pytest -q
