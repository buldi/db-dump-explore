name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Używa bash również na Windows, co upraszcza skrypty

    strategy:
      fail-fast: false # Opcjonalnie: zapobiega przerwaniu innych jobów, gdy jeden system zawiedzie
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # ===== 1. SETUP =====
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # Automatycznie obsługuje cache dla pip

      # ===== 2. INSTALL DEPENDENCIES =====
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install ruff black isort pytest coverage

      # ===== 3. CODE QUALITY (LINT & FORMAT) =====
      - name: Lint with ruff
        run: ruff check .

      - name: Black format verification
        run: black --check --diff .

      - name: Isort check
        run: isort . --check-only --diff

      # ===== 4. TESTS =====
      # - name: Run tests with coverage
      #   run: |
      #     coverage run -m pytest -q
      #     coverage xml
      #     coverage report -m

